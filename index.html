<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mở DeepSeek" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Auto Open DeepSeek</title>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #d4bbfc 0%, #8ec5fc 50%, #b8d8fb 100%);
            padding: 20px;
        }

        .glass-card {
            width: 100%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 32px;
            padding: 40px 24px 32px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
        }
        
        .glass-card h2 {
            font-size: 22px;
            font-weight: 600;
            color: #1c1c1e;
            margin-bottom: 16px;
        }
        .loading-text {
            color: #0A84FF;
            font-weight: 600;
            font-size: 16px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <h2>🚀 Đang mở DeepSeek...</h2>
        <div class="loading-text">Vui lòng chờ trong giây lát!</div>
    </div>

    <script>
        // Tên Shortcut trung gian (Open App Launcher)
        const shortcutName = "Open App Launcher"; 
        // Bundle ID của DeepSeek
        const bundleId = "com.deepseek.chat";

        // Hàm tạo URL Shortcuts và chuyển hướng
        const url = "shortcuts://run-shortcut?name=" + encodeURIComponent(shortcutName) + 
                    "&input=text&text=" + encodeURIComponent(bundleId);

        // Chuyển hướng ngay lập tức, không cần chờ DOM load
        window.location.replace(url);
    </script>
</body>
</html>
